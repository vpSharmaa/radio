<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Accessible Community Radio</title>

</head>


<body>

    <h1>Accessible Community Radio</h1>


    <label for="station">
        Select a station:
    </label>


    <select id="station">

        <option value="">
            Select a station
        </option>

    </select>


    <br><br>


    <button id="playButton">
        Play
    </button>


    <button id="stopButton">
        Stop
    </button>


    <p id="status" aria-live="polite">
        No station is playing.
    </p>


    <audio id="radioPlayer">
    </audio>


    <script>


        // --------------------------------
        // RADIO STATIONS
        // --------------------------------

        const stations = [

            {
                name: "Test Radio Station",
                frequency: "Internet",
                stream: "https://stream.zeno.fm/0r0xa792kwzuv"
            },

            {
                name: "Radio City",
                frequency: "91.1 MHz",
                stream: ""
            },

            {
                name: "BIG FM",
                frequency: "92.7 MHz",
                stream: ""
            },

            {
                name: "Red FM",
                frequency: "93.5 MHz",
                stream: ""
            },

            {
                name: "Radio One",
                frequency: "94.3 MHz",
                stream: ""
            },

            {
                name: "HIT 95 FM",
                frequency: "95.0 MHz",
                stream: ""
            },

            {
                name: "Radio Mirchi",
                frequency: "98.3 MHz",
                stream: "http://peridot.streamguys.com:7150/Mirchi"
            },

            {
                name: "AIR FM Gold",
                frequency: "100.1 MHz",
                stream: "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio005/hlspbaudio00564kbps.m3u8"
            },

            {
                name: "AIR FM Rainbow",
                frequency: "102.6 MHz",
                stream: "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio00464kbps.m3u8"
            },

            {
                name: "Fever 104 FM",
                frequency: "104.0 MHz",
                stream: ""
            },

            {
                name: "Ishq FM",
                frequency: "104.8 MHz",
                stream: ""
            },

            {
                name: "Gyan Vani",
                frequency: "105.6 MHz",
                stream: ""
            },

            {
                name: "Radio Nasha",
                frequency: "107.2 MHz",
                stream: ""
            }

        ];


        // --------------------------------
        // GET HTML ELEMENTS
        // --------------------------------

        const station =
            document.getElementById("station");

        const playButton =
            document.getElementById("playButton");

        const stopButton =
            document.getElementById("stopButton");

        const radioPlayer =
            document.getElementById("radioPlayer");

        const status =
            document.getElementById("status");


        // --------------------------------
        // PUT STATIONS INTO SELECT BOX
        // --------------------------------

        stations.forEach(function (radio) {

            const option =
                document.createElement("option");

            option.value =
                radio.stream;

            option.textContent =
                radio.name + " - " +
                radio.frequency;

            station.appendChild(option);

        });


        // --------------------------------
        // PLAY BUTTON
        // --------------------------------

        playButton.addEventListener(
            "click",
            function () {

                if (station.value === "") {

                    status.textContent =
                        "Please select a station first.";

                    return;
                }


                status.textContent =
                    "Connecting to radio...";


                radioPlayer.src =
                    station.value;


                radioPlayer.play()

                    .then(function () {

                        status.textContent =
                            "Radio is playing.";

                    })

                    .catch(function (error) {

                        status.textContent =
                            "The radio could not be started.";

                        console.log(
                            "Play error:",
                            error
                        );

                    });

            }
        );


        // --------------------------------
        // STOP BUTTON
        // --------------------------------

        stopButton.addEventListener(
            "click",
            function () {

                radioPlayer.pause();

                radioPlayer.removeAttribute("src");

                radioPlayer.load();


                status.textContent =
                    "Radio stopped.";

            }
        );


        // --------------------------------
        // AUDIO EVENTS
        // --------------------------------

        radioPlayer.addEventListener(
            "playing",
            function () {

                status.textContent =
                    "Radio is playing.";

            }
        );


        radioPlayer.addEventListener(
            "waiting",
            function () {

                status.textContent =
                    "Radio is buffering. Please wait.";

            }
        );


        radioPlayer.addEventListener(
            "error",
            function () {

                status.textContent =
                    "There is an error with this radio stream.";

                console.log(
                    "Audio error:",
                    radioPlayer.error
                );

            }
        );


    </script>


</body>

</html>

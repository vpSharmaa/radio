<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Accessible Community Radio - Part 6</title>

    <!-- HLS.js library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

</head>


<body>

    <h1>Accessible Community Radio</h1>


    <label for="station">
        Select a station:
    </label>


    <select id="station">

        <option value="">
            Select a station
        </option>

    </select>


    <br><br>


    <button id="playButton">
        Play
    </button>


    <button id="stopButton">
        Stop
    </button>


    <p id="status" aria-live="polite">
        No station is playing.
    </p>


    <audio id="radioPlayer">
    </audio>


    <script>


        // --------------------------------
        // RADIO STATIONS
        // --------------------------------

        const stations = [

            {
                name: "Test Radio Station",
                frequency: "Internet",
                stream: "https://stream.zeno.fm/0r0xa792kwzuv",
                type: "normal"
            },

            {
                name: "AIR FM Gold",
                frequency: "100.1 MHz",
                stream:
                    "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio005/hlspbaudio005_Auto.m3u8",
                type: "hls"
            },

            {
                name: "AIR FM Rainbow",
                frequency: "102.6 MHz",
                stream:
                    "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio004_Auto.m3u8",
                type: "hls"
            },

            {
    name: "Indraprastha",
    frequency: "Delhi",
    stream:
        "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio006/hlspbaudio006_Auto.m3u8",
    type: "hls"
},

{
    name: "VBS Delhi",
    frequency: "Hindi",
    stream:
        "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio238/hlspbaudio238_Auto.m3u8",
    type: "hls"
},

        ];

        // --------------------------------
        // GET HTML ELEMENTS
        // --------------------------------

        const station =
            document.getElementById("station");

        const playButton =
            document.getElementById("playButton");

        const stopButton =
            document.getElementById("stopButton");

        const radioPlayer =
            document.getElementById("radioPlayer");

        const status =
            document.getElementById("status");


        // --------------------------------
        // HLS PLAYER VARIABLE
        // --------------------------------

        let hls = null;


        // --------------------------------
        // PUT STATIONS INTO SELECT BOX
        // --------------------------------

        stations.forEach(function (radio) {

            const option =
                document.createElement("option");

            option.value =
                radio.stream;

            option.textContent =
                radio.name + " - " +
                radio.frequency;

            option.dataset.type =
                radio.type;

            station.appendChild(option);

        });


        // --------------------------------
        // PLAY BUTTON
        // --------------------------------

        playButton.addEventListener(
            "click",
            function () {

                if (station.value === "") {

                    status.textContent =
                        "Please select a station first.";

                    return;
                }


                const selectedOption =
                    station.options[
                        station.selectedIndex
                    ];


                const stream =
                    station.value;

                const type =
                    selectedOption.dataset.type;


                status.textContent =
                    "Connecting to radio...";


                // Stop previous HLS player

                if (hls !== null) {

                    hls.destroy();

                    hls = null;

                }


                // --------------------------------
                // HLS STREAM
                // --------------------------------

                if (type === "hls") {

                    if (Hls.isSupported()) {

                        hls = new Hls();

                        hls.loadSource(stream);

                        hls.attachMedia(radioPlayer);


                        hls.on(
                            Hls.Events.MANIFEST_PARSED,
                            function () {

                                radioPlayer.play()

                                    .then(function () {

                                        status.textContent =
                                            "Radio is playing.";

                                    })

                                    .catch(function () {

                                        status.textContent =
                                            "The radio could not be started.";

                                    });

                            }
                        );


                        hls.on(
                            Hls.Events.ERROR,
                            function () {

                                status.textContent =
                                    "There is an error with this radio stream.";

                            }
                        );

                    }


                    else {

                        status.textContent =
                            "HLS is not supported by this browser.";

                    }

                }


                // --------------------------------
                // NORMAL AUDIO STREAM
                // --------------------------------

                else {

                    radioPlayer.src =
                        stream;


                    radioPlayer.play()

                        .then(function () {

                            status.textContent =
                                "Radio is playing.";

                        })

                        .catch(function () {

                            status.textContent =
                                "The radio could not be started.";

                        });

                }

            }
        );


        // --------------------------------
        // STOP BUTTON
        // --------------------------------

        stopButton.addEventListener(
            "click",
            function () {

                radioPlayer.pause();


                if (hls !== null) {

                    hls.destroy();

                    hls = null;

                }


                radioPlayer.removeAttribute("src");

                radioPlayer.load();


                status.textContent =
                    "Radio stopped.";

            }
        );


        // --------------------------------
        // AUDIO PLAYING EVENT
        // --------------------------------

        radioPlayer.addEventListener(
            "playing",
            function () {

                status.textContent =
                    "Radio is playing.";

            }
        );


        // --------------------------------
        // AUDIO WAITING EVENT
        // --------------------------------

        radioPlayer.addEventListener(
            "waiting",
            function () {

                status.textContent =
                    "Radio is buffering. Please wait.";

            }
        );


    </script>

</body>

</html>
